<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pluto Essay Suite</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--s1:rgba(255,255,255,.04);--s2:rgba(255,255,255,.08);--s3:rgba(255,255,255,.12);
  --b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.14);--b3:rgba(255,255,255,.22);
  --text:#e0e0e8;--dim:#404050;--mid:#707080;
  --accent:#b0b0c8;--green:#5ef8a0;--blue:#4f8ef7;--red:#ff5f5f;--gold:#f0c060;
  --purple:#a78bfa;--teal:#2dd4bf;--orange:#fb923c;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}

/* ── LAYOUT ── */
#app{display:grid;grid-template-columns:200px 1fr 340px;height:100vh}

/* ── LEFT NAV ── */
#nav{border-right:1px solid var(--b1);display:flex;flex-direction:column;background:rgba(0,0,0,.7);backdrop-filter:blur(20px);overflow-y:auto}
.nav-logo{padding:16px 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--b1);flex-shrink:0}
.nav-logo svg{filter:drop-shadow(0 0 8px rgba(160,160,200,.3))}
.nav-brand{font-size:11px;font-weight:700;letter-spacing:3px;color:#fff}
.nav-sub{font-size:8px;color:var(--dim);font-family:'DM Mono',monospace}
.nav-section{padding:14px 12px 4px;font-size:8px;letter-spacing:2px;color:var(--dim);font-family:'DM Mono',monospace}
.nav-btn{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:1px 6px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--mid);transition:all .15s;border:none;background:transparent;text-align:left;width:calc(100% - 12px)}
.nav-btn:hover{background:var(--s2);color:var(--text)}
.nav-btn.active{background:var(--s2);color:#fff;border:1px solid var(--b2)}
.nav-btn .nb-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.nav-btn .nb-label{font-size:11.5px;font-weight:500}
.nav-badge{margin-left:auto;background:var(--blue);color:#000;font-size:8px;font-weight:700;padding:2px 6px;border-radius:10px;font-family:'DM Mono',monospace}
.nav-badge.new{background:var(--green)}
.nav-spacer{flex:1}
.nav-coins{margin:10px;background:rgba(240,192,96,.06);border:1px solid rgba(240,192,96,.15);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.nc-val{font-size:16px;font-weight:600;color:var(--gold);font-family:'DM Mono',monospace}
.nc-label{font-size:9px;color:var(--mid)}
.nc-xp{font-size:8px;color:var(--gold);font-family:'DM Mono',monospace;margin-top:1px}

/* ── MAIN EDITOR ── */
#main{display:flex;flex-direction:column;overflow:hidden;position:relative}
#toolbar{display:flex;align-items:center;gap:5px;padding:9px 14px;border-bottom:1px solid var(--b1);flex-shrink:0;flex-wrap:wrap;background:rgba(0,0,0,.4)}
.tb-group{display:flex;gap:2px;padding-right:7px;margin-right:3px;border-right:1px solid var(--b1)}
.tb-btn{background:transparent;border:1px solid transparent;border-radius:6px;color:var(--mid);font-size:11.5px;padding:4px 8px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.tb-btn:hover{background:var(--s2);color:var(--text);border-color:var(--b2)}
.tb-btn.active{background:var(--s2);color:#fff;border-color:var(--b2)}
.tb-divider{width:1px;background:var(--b1);height:18px;margin:0 3px}
#doc-title{background:transparent;border:none;outline:none;font-size:13px;font-weight:600;color:#fff;font-family:'DM Sans',sans-serif;min-width:180px;padding:3px 6px}
#doc-title::placeholder{color:var(--dim)}
.tb-spacer{flex:1}
.tb-status{font-size:9px;color:var(--dim);font-family:'DM Mono',monospace;display:flex;align-items:center;gap:8px}
#wc-bar-wrap{width:60px;height:3px;background:var(--b1);border-radius:2px;overflow:hidden}
#wc-bar{height:100%;width:0%;background:var(--green);border-radius:2px;transition:width .3s}
#wc-target-btn{background:transparent;border:1px solid var(--b1);border-radius:5px;color:var(--dim);font-size:9px;padding:2px 6px;cursor:pointer;font-family:'DM Mono',monospace}
#wc-target-btn:hover{color:var(--text);border-color:var(--b2)}

#editor-wrap{flex:1;overflow-y:auto;padding:36px 72px;scrollbar-width:thin;scrollbar-color:var(--b2) transparent}
#editor{min-height:calc(100vh - 200px);outline:none;font-size:14.5px;line-height:1.9;color:var(--text);caret-color:var(--accent)}
#editor:empty::before{content:attr(data-placeholder);color:var(--dim);pointer-events:none;white-space:pre-line}
#editor p{margin-bottom:11px}
#editor h1{font-size:26px;font-weight:300;letter-spacing:-0.5px;margin-bottom:14px;color:#fff}
#editor h2{font-size:18px;font-weight:500;margin-bottom:10px;color:#fff}
#editor h3{font-size:15px;font-weight:600;margin-bottom:7px;color:var(--accent)}
#editor blockquote{border-left:2px solid var(--accent);padding-left:14px;color:var(--mid);font-style:italic;margin:14px 0}
#editor strong{color:#fff;font-weight:600}
#editor em{color:var(--accent)}
#editor ul,#editor ol{padding-left:22px;margin-bottom:11px}
#editor li{margin-bottom:4px}

/* College essay char counter */
#college-counter{position:absolute;bottom:12px;right:360px;font-size:10px;font-family:'DM Mono',monospace;color:var(--mid);background:rgba(0,0,0,.6);padding:4px 9px;border-radius:6px;border:1px solid var(--b1);display:none}
#college-counter.warn{color:var(--gold)}
#college-counter.over{color:var(--red)}

/* ── RIGHT PANEL ── */
#right{border-left:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden;background:rgba(0,0,0,.3)}
#right-tabs{display:flex;border-bottom:1px solid var(--b1);flex-shrink:0;background:rgba(0,0,0,.3)}
.rt-tab{flex:1;padding:9px 3px;font-size:9px;font-weight:600;letter-spacing:.4px;color:var(--mid);background:transparent;border:none;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.rt-tab:hover{color:var(--text)}
.rt-tab.active{color:#fff;border-bottom:1.5px solid var(--accent)}
#right-body{flex:1;overflow-y:auto;padding:12px;scrollbar-width:thin;scrollbar-color:var(--b2) transparent}

/* AI panel */
.ai-msg{background:var(--s1);border:1px solid var(--b1);border-radius:10px 10px 10px 2px;padding:9px 12px;margin-bottom:7px;font-size:12px;line-height:1.6;color:#c0c0cc}
.user-msg{background:var(--s2);border:1px solid var(--b2);border-radius:10px 10px 2px 10px;padding:9px 12px;margin-bottom:7px;font-size:12px;color:#fff;margin-left:18px}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px}
.action-btn{background:var(--s1);border:1px solid var(--b1);border-radius:7px;color:var(--mid);font-size:10px;font-weight:600;padding:7px 5px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;text-align:left}
.action-btn:hover{background:var(--s2);color:#fff;border-color:var(--b2)}

/* Source cards */
.source-card{background:rgba(79,142,247,.04);border:1px solid rgba(79,142,247,.12);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.sc-title{font-size:11.5px;font-weight:600;color:#fff;margin-bottom:2px;line-height:1.4}
.sc-title a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.15)}
.sc-title a:hover{border-color:var(--blue)}
.sc-meta{font-size:9px;color:var(--mid);font-family:'DM Mono',monospace;margin-bottom:4px}
.sc-type{display:inline-block;background:rgba(79,142,247,.1);border:1px solid rgba(79,142,247,.2);border-radius:4px;font-size:8px;color:var(--blue);padding:1px 5px;margin-right:4px;font-family:'DM Mono',monospace;text-transform:uppercase}
.sc-sum{font-size:11px;color:var(--mid);line-height:1.5;margin:5px 0}
.sc-cite{font-size:9px;color:rgba(79,142,247,.7);font-family:'DM Mono',monospace;background:rgba(79,142,247,.06);border-radius:5px;padding:5px 7px;line-height:1.5;margin-bottom:6px;word-break:break-word}
.sc-btns{display:flex;gap:4px}
.sc-btn{flex:1;background:transparent;border:1px solid var(--b1);border-radius:5px;color:var(--mid);font-size:9px;font-weight:600;padding:4px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.sc-btn:hover{background:var(--s2);color:#fff}

/* Analysis panel */
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.score-card{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:8px 10px}
.score-label{font-size:8.5px;color:var(--mid);font-family:'DM Mono',monospace;text-transform:uppercase;margin-bottom:3px}
.score-val{font-size:20px;font-weight:600;font-family:'DM Mono',monospace}
.score-bar{height:2px;background:var(--b1);border-radius:2px;margin-top:4px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:2px;transition:width .5s}
.grade-badge{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;font-size:20px;font-weight:700;font-family:'DM Mono',monospace;border:2px solid}
.issue-card{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.issue-label{font-size:9px;font-weight:700;font-family:'DM Mono',monospace;margin-bottom:3px}
.issue-fix{font-size:10.5px;color:var(--mid);line-height:1.5}
.sev-high{color:var(--red)}
.sev-medium{color:var(--gold)}
.sev-low{color:var(--green)}

/* Thesis cards */
.thesis-card{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.thesis-card:hover{border-color:var(--b3);background:var(--s2)}
.thesis-card.selected{border-color:var(--blue);background:rgba(79,142,247,.08)}
.thesis-angle{font-size:9px;color:var(--blue);font-family:'DM Mono',monospace;font-weight:600;text-transform:uppercase;margin-bottom:5px}
.thesis-text{font-size:12px;color:#fff;line-height:1.6;margin-bottom:8px}
.thesis-strength{display:flex;align-items:center;gap:6px}
.ts-bar{flex:1;height:3px;background:var(--b1);border-radius:2px;overflow:hidden}
.ts-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:2px}
.ts-val{font-size:9px;font-family:'DM Mono',monospace;color:var(--mid)}
.thesis-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.thesis-tag{font-size:8px;background:rgba(255,255,255,.05);border:1px solid var(--b1);border-radius:4px;color:var(--mid);padding:1px 6px;font-family:'DM Mono',monospace}

/* Write config panel */
.cfg-section{margin-bottom:14px}
.cfg-label{font-size:8.5px;color:var(--dim);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.cfg-pills{display:flex;gap:4px;flex-wrap:wrap}
.cfg-pill{background:transparent;border:1px solid var(--b1);border-radius:6px;color:var(--mid);font-size:10px;font-weight:600;padding:4px 10px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.cfg-pill:hover{background:var(--s2);color:var(--text)}
.cfg-pill.on{background:var(--s2);border-color:var(--b3);color:#fff}
.cfg-input{width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:7px;color:#fff;padding:7px 10px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none;transition:border .2s}
.cfg-input:focus{border-color:var(--b2)}
.cfg-input::placeholder{color:var(--dim)}
.generate-btn{width:100%;background:linear-gradient(135deg,#4f8ef7,#a78bfa);border:none;border-radius:9px;color:#fff;font-size:13px;font-weight:700;padding:12px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;letter-spacing:.3px;margin-top:4px}
.generate-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.generate-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.generate-btn.secondary{background:var(--s2);border:1px solid var(--b2);font-size:11.5px;padding:9px}

/* Format pills */
#fmt-row{display:flex;gap:4px;margin-bottom:10px}
.fmt-pill{background:transparent;border:1px solid var(--b1);border-radius:6px;color:var(--mid);font-size:9.5px;font-weight:600;padding:3px 10px;cursor:pointer;transition:all .15s;font-family:'DM Mono',monospace}
.fmt-pill.on{background:var(--s2);border-color:var(--b2);color:#fff}

/* Right panel input */
#rp-input-wrap{padding:9px;border-top:1px solid var(--b1);flex-shrink:0;background:rgba(0,0,0,.3)}
#rp-input-row{display:flex;gap:5px}
#rp-input{flex:1;background:var(--s1);border:1px solid var(--b1);border-radius:8px;color:#fff;padding:7px 10px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none;transition:border .2s;resize:none}
#rp-input:focus{border-color:var(--b2)}
#rp-input::placeholder{color:var(--dim)}
#rp-send{background:var(--accent);border:none;border-radius:8px;color:#000;font-size:10.5px;font-weight:700;padding:7px 12px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;white-space:nowrap}
#rp-send:hover{filter:brightness(1.15)}
#rp-send:disabled{opacity:.4;cursor:not-allowed}

/* Saved list */
#saved-list .nav-btn .nb-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}

/* Loading */
.loading-row{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:11px;color:var(--mid);font-family:'DM Mono',monospace}
.spinner{width:14px;height:14px;border:2px solid var(--b2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dots::after{content:'';animation:dotanim 1.2s infinite}
@keyframes dotanim{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}

/* Reward popup */
#reward-popup{position:fixed;top:16px;right:16px;background:#0a0a14;border:1px solid rgba(240,192,96,.3);border-radius:12px;padding:12px 16px;z-index:200;transform:translateX(120%);transition:transform .4s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;gap:10px}
#reward-popup.show{transform:translateX(0)}
.rp-icon{font-size:22px}
.rp-text .rp-title{font-size:12px;font-weight:600;color:#fff}
.rp-text .rp-sub{font-size:10px;color:var(--gold);font-family:'DM Mono',monospace}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
#modal.show{opacity:1;pointer-events:auto}
#modal-box{background:#080810;border:1px solid var(--b2);border-radius:16px;padding:24px;max-width:480px;width:90%;transform:translateY(16px);transition:transform .2s}
#modal.show #modal-box{transform:translateY(0)}
.modal-title{font-size:17px;font-weight:500;color:#fff;margin-bottom:5px}
.modal-sub{font-size:12.5px;color:var(--mid);margin-bottom:18px;line-height:1.5}
.modal-input{width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:9px;color:#fff;padding:9px 12px;font-size:12.5px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:10px;transition:border .2s}
.modal-input:focus{border-color:var(--b2)}
.modal-input::placeholder{color:var(--dim)}
.modal-btns{display:flex;gap:7px;justify-content:flex-end}
.modal-btn{background:var(--s2);border:1px solid var(--b2);border-radius:8px;color:#fff;font-size:11.5px;font-weight:600;padding:8px 18px;cursor:pointer;font-family:'DM Sans',sans-serif}
.modal-btn.primary{background:linear-gradient(135deg,#4f8ef7,#a78bfa);color:#fff;border:none}
.modal-btn:hover{filter:brightness(1.1)}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
::selection{background:rgba(79,142,247,.3)}

/* Section divider */
.panel-divider{height:1px;background:var(--b1);margin:10px 0}
.panel-heading{font-size:9px;font-family:'DM Mono',monospace;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.empty-state{font-size:11px;color:var(--dim);text-align:center;padding:24px 8px;line-height:1.6}
.empty-state .es-icon{font-size:28px;display:block;margin-bottom:8px}
</style>
</head>
<body>
<div id="app">

  <!-- LEFT NAV -->
  <div id="nav">
    <div class="nav-logo">
      <svg viewBox="0 0 36 36" fill="none" width="26" height="26">
        <circle cx="18" cy="18" r="10" fill="url(#pg)"/>
        <ellipse cx="18" cy="18" rx="16.5" ry="5" stroke="url(#rg)" stroke-width="2" fill="none" transform="rotate(-20 18 18)"/>
        <defs>
          <radialGradient id="pg" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#c8c8d0"/><stop offset="100%" stop-color="#3a3a50"/></radialGradient>
          <linearGradient id="rg" x1="0" y1="0" x2="36" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="rgba(200,200,210,0)"/><stop offset="50%" stop-color="rgba(200,200,210,0.8)"/><stop offset="100%" stop-color="rgba(200,200,210,0)"/></linearGradient>
        </defs>
      </svg>
      <div><div class="nav-brand">PLUTO</div><div class="nav-sub">essay suite</div></div>
    </div>

    <div class="nav-section">WRITE</div>
    <button class="nav-btn active" data-view="write"><span class="nb-icon">✍️</span><span class="nb-label">Essay Writer</span></button>
    <button class="nav-btn" data-view="college"><span class="nb-icon">🎓</span><span class="nb-label">College App</span><span class="nav-badge new">NEW</span></button>
    <button class="nav-btn" data-view="research-paper"><span class="nb-icon">📚</span><span class="nb-label">Research Paper</span></button>

    <div class="nav-section">TOOLS</div>
    <button class="nav-btn" data-view="sources"><span class="nb-icon">🔬</span><span class="nb-label">Find Sources</span><span class="nav-badge">AI</span></button>
    <button class="nav-btn" data-view="thesis"><span class="nb-icon">💡</span><span class="nb-label">Thesis Builder</span></button>
    <button class="nav-btn" data-view="humanize"><span class="nb-icon">🧬</span><span class="nb-label">Humanizer</span></button>
    <button class="nav-btn" data-view="outline"><span class="nb-icon">📋</span><span class="nb-label">Outline</span></button>
    <button class="nav-btn" data-view="analyze"><span class="nb-icon">📊</span><span class="nb-label">Analyze Essay</span></button>
    <button class="nav-btn" data-view="cite"><span class="nb-icon">📎</span><span class="nb-label">Citations</span></button>

    <div class="nav-section" style="margin-top:6px">SAVED</div>
    <div id="saved-list"></div>

    <div class="nav-spacer"></div>
    <div class="nav-coins">
      <span style="font-size:16px">🪙</span>
      <div><div class="nc-val" id="coin-display">0</div><div class="nc-label">coins earned</div><div class="nc-xp" id="xp-display">LVL 1 · 0 XP</div></div>
    </div>
  </div>

  <!-- MAIN EDITOR -->
  <div id="main">
    <div id="toolbar">
      <input id="doc-title" placeholder="Untitled document..." autocomplete="off"/>
      <div class="tb-divider"></div>
      <div class="tb-group">
        <button class="tb-btn" data-cmd="bold"><b>B</b></button>
        <button class="tb-btn" data-cmd="italic"><i>I</i></button>
        <button class="tb-btn" data-cmd="underline"><u>U</u></button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" data-heading="1">H1</button>
        <button class="tb-btn" data-heading="2">H2</button>
        <button class="tb-btn" data-heading="3">H3</button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" data-action="ul">• List</button>
        <button class="tb-btn" data-action="ol">1. List</button>
        <button class="tb-btn" data-action="bq">❝</button>
      </div>
      <div class="tb-spacer"></div>
      <div class="tb-status">
        <div id="wc-bar-wrap"><div id="wc-bar"></div></div>
        <span id="word-count">0 words</span>
        <button id="wc-target-btn">/ 800</button>
      </div>
      <button class="tb-btn" id="tb-save">💾 Save</button>
      <button class="tb-btn" id="tb-copy">📋 Copy</button>
      <button class="tb-btn" id="tb-download">⬇️ Export</button>
    </div>

    <div id="editor-wrap">
      <div id="editor" contenteditable="true"
        data-placeholder="Start writing here, or use the panel on the right to generate an essay, find real sources, build a thesis, and more.

Select any text and press Ctrl+K to improve it instantly."></div>
    </div>
    <div id="college-counter">0 / 650 words</div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right">
    <div id="right-tabs">
      <button class="rt-tab active" data-tab="ai">✍️ Write</button>
