<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <title>Pluto Chat</title>
  <link rel="stylesheet" href="katex.min.css">
  <script defer src="katex.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chat.css">
  <script defer src="chat.js"></script>
  <style>
    /* ── CSS variable overrides for light/dark theming ── */
    :root {
      --bg:     #FAFAF8; --s1: #F3F2EF; --s2: #ECEAE4;
      --b1:     rgba(26,25,21,0.08); --b2: rgba(26,25,21,0.14);
      --text:   #1A1915; --dim: #A09D97; --mid: #6B6860;
      --accent: #2D6EFF; --green: #22C55E; --blue: #2D6EFF;
      --red:    #EF4444; --gold: #F59E0B;
      --accent-primary:       #2D6EFF;
      --accent-primary-light: #EBF1FF;
      --border-subtle:  rgba(26,25,21,0.08);
      --border-default: rgba(26,25,21,0.14);
      --transition-fast: 120ms cubic-bezier(0.4,0,0.2,1);
    }
    [data-theme="dark"] {
      --bg:     #0F1117; --s1: #161820; --s2: #1E2130;
      --b1:     rgba(240,239,233,0.06); --b2: rgba(240,239,233,0.10);
      --text:   #F0EFE9; --dim: #5C5A66; --mid: #9896A0;
      --accent: #4D8BFF; --green: #34D399; --blue: #4D8BFF;
      --red:    #F87171; --gold: #FBBF24;
      --accent-primary:       #4D8BFF;
      --accent-primary-light: rgba(77,139,255,0.12);
      --border-subtle:  rgba(240,239,233,0.06);
      --border-default: rgba(240,239,233,0.10);
    }
    /* ── Font overrides ── */
    body, .new-chat-btn, .topbar-btn, .empty-chip, .pill, .src-btn,
    .grade-btn, .fc-nav-btn, .study-tab { font-family: 'Satoshi', 'DM Sans', system-ui, sans-serif; }
    .input-hint, .chat-item-time, .fc-lbl, .study-sec-label, .config-lbl,
    .sh-label, .res-meta, .brain-label, .sidebar-brand-text,
    #sheet-title { font-family: 'JetBrains Mono', 'DM Mono', monospace; }
    /* ── New chat bubble styles ── */
    .ai-bubble {
      background: var(--s1); border: 1px solid var(--b1);
      border-left: 3px solid var(--accent-primary);
      border-radius: 16px 16px 16px 4px;
      color: var(--text); font-family: 'Satoshi', 'DM Sans', sans-serif;
      font-size: 13.5px; line-height: 1.65; padding: 12px 16px;
    }
    .user-bubble {
      background: var(--accent-primary-light); border: 1px solid var(--border-default);
      border-radius: 16px 16px 4px 16px;
      color: var(--text); font-family: 'Satoshi', 'DM Sans', sans-serif;
      font-size: 13.5px; line-height: 1.6; padding: 11px 16px;
    }
    /* ── Theme toggle button ── */
    #theme-toggle-btn {
      background: transparent; border: 1px solid var(--b1); border-radius: 8px;
      color: var(--mid); cursor: pointer; padding: 4px 8px;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition-fast);
    }
    #theme-toggle-btn:hover { background: var(--s2); color: var(--text); }
    .icon-sun, .icon-moon { display: none; pointer-events: none; }
  </style>
</head>
<body>
<div id="app">

  <!-- ── SIDEBAR ─────────────────────────── -->
  <div id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <svg viewBox="0 0 36 36" fill="none" width="22" height="22" style="flex-shrink:0">
          <circle cx="18" cy="18" r="10" fill="url(#cpg)"/>
          <ellipse cx="18" cy="18" rx="16.5" ry="5" stroke="url(#crg)" stroke-width="2" fill="none" transform="rotate(-20 18 18)"/>
          <defs>
            <radialGradient id="cpg" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#c8c8d0"/>
              <stop offset="60%" stop-color="#8888a0"/>
              <stop offset="100%" stop-color="#3a3a50"/>
            </radialGradient>
            <linearGradient id="crg" x1="0" y1="0" x2="36" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="rgba(200,200,210,0)"/>
              <stop offset="50%" stop-color="rgba(200,200,210,0.7)"/>
              <stop offset="100%" stop-color="rgba(200,200,210,0)"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="sidebar-brand-text">PLUTO</span>
      </div>
      <button id="new-chat-btn" class="new-chat-btn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New Chat
      </button>
    </div>
    <div id="chat-list" class="chat-list"></div>
    <div class="sidebar-fade"></div>
  </div>

  <!-- ── MAIN ────────────────────────────── -->
  <div id="main">

    <!-- Top bar -->
    <div id="topbar">
      <button id="sidebar-toggle" class="topbar-icon-btn" title="Toggle sidebar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title-wrap">
        <span id="chat-title" class="chat-title" spellcheck="false"></span>
        <button id="title-edit-btn" class="title-edit-btn" title="Rename">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </div>
      <div class="topbar-right">
        <div id="tutor-pill" class="tutor-pill hidden"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> TUTOR</div>
        <button id="theme-toggle-btn" title="Toggle theme" aria-label="Toggle light/dark mode">
          <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button id="share-btn" class="topbar-btn">↗ Share</button>
        <div class="menu-wrap">
          <button id="menu-btn" class="topbar-btn topbar-btn-icon">⋯</button>
          <div id="dropdown-menu" class="dropdown hidden">
            <button id="menu-rename"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>  Rename</button>
            <button id="menu-delete" class="danger"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>  Delete chat</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Brain panel — same DOM as popup.html -->
    <div id="brain-panel" class="brain-panel">
      <div class="brain-header" id="brain-toggle">
        <div class="brain-title">
          <span class="brain-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"/></svg></span>
          <span class="brain-label">SHARED BRAIN</span>
        </div>
        <div class="brain-summary">
          <span id="brain-size">—</span> questions
          <span class="brain-chevron">▾</span>
        </div>
      </div>
      <div class="brain-body" id="brain-body">
        <div class="brain-stat-row">
          <div class="brain-stat">
            <div class="brain-stat-num" id="brain-asked">0</div>
            <div class="brain-stat-label">questions you've asked</div>
          </div>
          <div class="brain-stat">
            <div class="brain-stat-num" id="brain-matched">0</div>
            <div class="brain-stat-label">matches you've received</div>
          </div>
          <div class="brain-stat">
            <div class="brain-stat-num" id="brain-helped">~0</div>
            <div class="brain-stat-label">est. students you've helped</div>
          </div>
        </div>
        <div id="brain-empty-msg" class="brain-empty" style="display:none">Ask your first question to start contributing to the brain</div>
        <div class="brain-recent" id="brain-recent">
          <div class="brain-recent-title">YOUR LAST QUESTION MATCHED</div>
          <div id="brain-recent-list"></div>
        </div>
      </div>
    </div>

    <!-- Star canvas + messages -->
    <canvas id="star-canvas"></canvas>
    <div id="chat-box"></div>

    <!-- Input area -->
    <div id="input-area">
      <!-- Feature bar -->
      <div id="feat-bar">
        <div id="feat-row-primary">
          <button class="feat-btn feat-primary" id="btn-tutor"   data-tip="Tutor Mode">  <span class="feat-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span><span class="feat-label">Tutor</span></button>
          <button class="feat-btn feat-primary" id="btn-flash"   data-tip="Flashcards">  <span class="feat-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></span><span class="feat-label">Cards</span></button>
          <button class="feat-btn feat-primary" id="btn-test"    data-tip="Practice Test"><span class="feat-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 12 2 2 4-4"/></svg></span><span class="feat-label">Test</span></button>
          <button class="feat-btn feat-primary" id="btn-planner" data-tip="Task Planner"><span class="feat-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span class="feat-label">Plan</span></button>
          <button class="feat-btn feat-primary" id="btn-essay"   data-tip="Essay Helper"><span class="feat-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span><span class="feat-label">Essay</span></button>
        </div>
        <div id="feat-row-secondary">
          <button class="feat-btn" id="btn-pdf"     data-tip="Scan PDF"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></button>
          <button class="feat-btn" id="btn-podcast" data-tip="Podcast"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
          <button class="feat-btn" id="btn-vocab"   data-tip="Vocab"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3"/><path d="M4 19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7H6"/></svg></button>
          <button class="feat-btn" id="btn-grade"   data-tip="Grades"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg></button>
          <button class="feat-btn" id="btn-timer"   data-tip="Focus Timer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
          <button class="feat-btn" id="btn-mood"    data-tip="Focus Sounds"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
          <button class="feat-btn" id="btn-feynman" data-tip="Feynman"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
          <div class="feat-divider"></div>
          <button class="feat-btn" id="btn-dashboard" data-tip="Dashboard"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
          <button class="feat-btn" id="btn-hub"       data-tip="Research Hub"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
          <button class="feat-btn" id="btn-game"      data-tip="Study Game"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg></button>
        </div>
      </div>
      <!-- Text row -->
      <div id="input-row">
        <textarea id="user-input" placeholder="Ask Pluto anything..." rows="1" autocomplete="off"></textarea>
        <button id="send-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter for new line</div>
    </div>

  </div><!-- /main -->

  <!-- ── BOTTOM SHEET (fixed over full viewport) ── -->
  <div id="sheet-backdrop" class="hidden"></div>
  <div id="bottom-sheet" class="hidden">
    <div id="sheet-handle"></div>
    <div id="sheet-header">
      <span id="sheet-title"></span>
      <button id="sheet-close">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>

  <!-- ── MESSAGE DOTS ── -->
  <div id="msg-dots"></div>

  <!-- ── ACTIVE FEATURE PILL ── -->
  <div id="active-feat-pill" class="hidden">
    <span id="afp-icon"></span>
    <span id="afp-label"></span>
    <button id="afp-close">✕</button>
  </div>

</div><!-- /app -->
<script src="sidebar.js"></script>
</body>
</html>
