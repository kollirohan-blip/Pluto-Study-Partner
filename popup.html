<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="katex.min.css">
  <script defer src="katex.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <script defer src="popup.js"></script>
  <style>
    /* ── New CSS variables — override style.css :root ── */
    :root {
      --bg:     #FAFAF8; --s1: #F3F2EF; --s2: #ECEAE4;
      --b1:     rgba(26,25,21,0.08); --b2: rgba(26,25,21,0.14);
      --text:   #1A1915; --dim: #A09D97; --mid: #6B6860;
      --accent: #2D6EFF; --green: #22C55E; --blue: #2D6EFF;
      --red:    #EF4444; --gold: #F59E0B;
      --accent-primary:       #2D6EFF;
      --accent-primary-light: #EBF1FF;
      --accent-success:       #22C55E;
      --accent-warm:          #FF6B35;
      --border-subtle:  rgba(26,25,21,0.08);
      --border-default: rgba(26,25,21,0.14);
      --radius-full: 9999px; --radius-md: 12px;
      --transition-fast: 120ms cubic-bezier(0.4,0,0.2,1);
      --transition-base: 200ms cubic-bezier(0.4,0,0.2,1);
    }
    [data-theme="dark"] {
      --bg:     #0F1117; --s1: #161820; --s2: #1E2130;
      --b1:     rgba(240,239,233,0.06); --b2: rgba(240,239,233,0.10);
      --text:   #F0EFE9; --dim: #5C5A66; --mid: #9896A0;
      --accent: #4D8BFF; --green: #34D399; --blue: #4D8BFF;
      --red:    #F87171; --gold: #FBBF24;
      --accent-primary:       #4D8BFF;
      --accent-primary-light: rgba(77,139,255,0.12);
      --accent-success:       #34D399;
      --accent-warm:          #FF7A47;
      --border-subtle:  rgba(240,239,233,0.06);
      --border-default: rgba(240,239,233,0.10);
    }

    /* ── Fonts ── */
    body { font-family: 'Satoshi', 'DM Sans', system-ui, sans-serif; }

    /* ── Header ── */
    #pluto-title {
      font-family: 'Cabinet Grotesk', 'Outfit', system-ui, sans-serif;
      font-size: 12.5px; font-weight: 800; letter-spacing: 2px; color: var(--text);
    }
    #subtitle { font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 9px; color: var(--dim); letter-spacing: 0.3px; }
    #streak-pill { font-family: 'JetBrains Mono', 'DM Mono', monospace; }

    /* Theme toggle in header */
    #theme-toggle-btn {
      background: transparent; border: 1px solid var(--b1); border-radius: 8px;
      color: var(--mid); cursor: pointer; padding: 3px 7px;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition-fast);
    }
    #theme-toggle-btn:hover { background: var(--s2); color: var(--text); }
    #theme-toggle-btn .icon-sun,
    #theme-toggle-btn .icon-moon { display: none; pointer-events: none; }

    /* ── Brain panel — subtle ── */
    .brain-panel { background: transparent; border-bottom: 1px solid var(--b1); }
    .brain-header { padding: 5px 14px; }
    .brain-header:hover { background: var(--s1); }
    .brain-label { color: var(--mid); font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 8.5px; letter-spacing: 1.5px; }
    .brain-summary { font-family: 'JetBrains Mono', 'DM Mono', monospace; font-size: 10px; }
    .brain-summary #brain-size { color: var(--accent-primary); font-weight: 700; }

    /* Brain body stats */
    .brain-stat-num { font-family: 'Cabinet Grotesk', 'Outfit', system-ui, sans-serif; font-size: 18px; font-weight: 700; color: var(--accent-primary); }
    .brain-stat-label { font-family: 'JetBrains Mono', 'DM Mono', monospace; }

    /* ── Chat bubbles — new style ── */
    .ai-bubble {
      background: var(--s1); border: 1px solid var(--b1);
      padding: 11px 14px; border-radius: 16px 16px 16px 4px;
      border-left: 3px solid var(--accent-primary);
      font-size: 13px; line-height: 1.65; color: var(--text); max-width: 90%;
      font-family: 'Satoshi', 'DM Sans', system-ui, sans-serif;
    }
    .user-bubble {
      background: var(--accent-primary-light); border: 1px solid var(--border-default);
      padding: 10px 14px; border-radius: 16px 16px 4px 16px;
      font-size: 13px; font-weight: 500; color: var(--accent-primary); max-width: 82%;
      font-family: 'Satoshi', 'DM Sans', system-ui, sans-serif;
    }
    [data-theme="dark"] .user-bubble { color: var(--text); }

    /* ── Feature toolbar — 4-col grid ── */
    #feat-bar { gap: 5px; }

    #feat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    .feat-grid-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px;
      background: var(--s1); border: 1px solid var(--b1);
      border-radius: 10px; padding: 10px 4px 9px;
      cursor: pointer; min-height: 52px;
      transition: all var(--transition-fast);
    }
    .feat-grid-btn:hover { background: var(--s2); border-color: var(--b2); }
    .feat-grid-btn.active { background: var(--accent-primary-light); border-color: var(--accent-primary); }
    .fgb-ico { display: flex; align-items: center; justify-content: center; color: var(--mid); }
    .feat-grid-btn:hover .fgb-ico { color: var(--text); }
    .feat-grid-btn.active .fgb-ico { color: var(--accent-primary); }
    .fgb-lbl {
      font-family: 'Satoshi', 'DM Sans', system-ui, sans-serif;
      font-size: 9px; font-weight: 700; letter-spacing: 0.2px;
      color: var(--mid);
    }
    .feat-grid-btn:hover .fgb-lbl { color: var(--text); }
    .feat-grid-btn.active .fgb-lbl { color: var(--accent-primary); }

    /* Secondary row — hidden by default, toggled by More */
    #feat-row-secondary { display: none; padding-top: 2px; flex-wrap: wrap; }
    #feat-row-secondary.visible { display: flex; }
    #feat-row-secondary .feat-btn {
      font-size: 14px; width: 30px; height: 30px;
      background: var(--s1); border-color: var(--b1);
    }
    #feat-row-secondary .feat-btn:hover { background: var(--s2); border-color: var(--b2); }

    /* ── Input row ── */
    #input-row {
      background: var(--s1); border: 1.5px solid var(--b1);
      border-radius: var(--radius-full); padding: 5px 5px 5px 14px;
    }
    #input-row:focus-within { border-color: var(--accent-primary); background: var(--s2); }
    #user-input {
      font-family: 'Satoshi', 'DM Sans', system-ui, sans-serif;
      font-size: 13px; color: var(--text);
    }
    #user-input::placeholder { color: var(--dim); }
    #send-btn {
      background: var(--accent-primary); color: #fff;
      border-radius: 50%; width: 28px; height: 28px;
    }
    #send-btn:hover { filter: brightness(1.15); transform: scale(1.06); }

    /* Dot theme buttons - make them less prominent */
    .dot { opacity: 0.5; }
    .dot:hover { opacity: 1; }

    /* ── Dashboard shortcut ── */
    #open-dashboard-btn {
      width: 100%; display: flex; align-items: center; gap: 9px;
      background: var(--accent-primary-light);
      border: none; border-bottom: 1px solid var(--b1);
      padding: 8px 14px;
      font-size: 11.5px; font-weight: 700; color: var(--accent-primary);
      cursor: pointer; font-family: 'Satoshi', 'DM Sans', sans-serif;
      transition: all var(--transition-fast); letter-spacing: .2px;
      text-align: left;
    }
    #open-dashboard-btn:hover { filter: brightness(0.94); }
    .dash-arrow { margin-left: auto; font-size: 11px; color: var(--accent-primary); }

    /* ── Popup layout wrapper ── */
    .popup-wrapper { display: flex; min-height: 100%; }
    .popup-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    /* ── Popup sidebar — icon-only collapsed, expands on hover ── */
    .popup-sidebar {
      width: 46px; flex-shrink: 0;
      display: flex; flex-direction: column; align-items: stretch;
      gap: 1px; padding: 6px 4px;
      background: var(--s1); border-left: 1px solid var(--b1);
      overflow-x: clip; overflow-y: auto;
      transition: width 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    .popup-sidebar:hover { width: 160px; }
    .popup-sidebar::-webkit-scrollbar { display: none; }

    /*
      Buttons are fixed 152px wide. The sidebar content box is 38px when
      collapsed (46px - 4px padding each side), clipping the label.
      padding-left:14px + icon:16px + gap:12px = 42px > 38px → label hidden.
      On hover sidebar grows to 152px content box → full button visible.
      Use .popup-sidebar selector for higher specificity than .feat-btn.
    */
    .popup-sidebar .popup-nav-item {
      display: flex; flex-direction: row; align-items: center;
      justify-content: flex-start;
      width: 152px; height: 30px; border-radius: 7px;
      padding: 0 0 0 14px; gap: 12px;
      background: transparent; border: none; min-width: 0;
      cursor: pointer; color: var(--mid); white-space: nowrap;
      flex-shrink: 0; transform: none; box-shadow: none; font-size: inherit;
      transition: background var(--transition-fast), color var(--transition-fast);
    }
    .popup-sidebar .popup-nav-item:hover {
      background: var(--s2); color: var(--text); transform: none; border: none;
    }
    .popup-sidebar .popup-nav-item.active {
      background: var(--accent-primary-light); color: var(--accent-primary);
      border: none; box-shadow: none;
    }
    /* suppress .feat-btn tooltip in sidebar */
    .popup-sidebar .popup-nav-item::after { display: none !important; }

    .popup-nav-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .popup-nav-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1px; color: inherit; }

    .popup-sidebar-divider {
      height: 1px; background: var(--b1); margin: 3px 2px; flex-shrink: 0;
    }
  </style>
</head>
<body>
<div class="popup-wrapper">
<div class="popup-main">

  <!-- HEADER -->
  <div id="header">
    <div id="header-left">
      <div id="logo">
        <svg viewBox="0 0 36 36" fill="none" width="30" height="30">
          <circle cx="18" cy="18" r="10" fill="url(#pg)"/>
          <ellipse cx="18" cy="18" rx="16.5" ry="5" stroke="url(#rg)" stroke-width="2" fill="none" transform="rotate(-20 18 18)"/>
          <defs>
            <radialGradient id="pg" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#c8c8d0"/>
              <stop offset="60%" stop-color="#8888a0"/>
              <stop offset="100%" stop-color="#3a3a50"/>
            </radialGradient>
            <linearGradient id="rg" x1="0" y1="0" x2="36" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="rgba(200,200,210,0)"/>
              <stop offset="40%" stop-color="rgba(200,200,210,0.7)"/>
              <stop offset="60%" stop-color="rgba(200,200,210,0.7)"/>
              <stop offset="100%" stop-color="rgba(200,200,210,0)"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div id="brand-text">
        <div id="pluto-title">PLUTO</div>
        <div id="subtitle">your study partner</div>
      </div>
    </div>
    <div id="header-right">
      <div id="streak-pill">
        <span>🔥</span><span id="streak-count">0</span>
      </div>
      <div id="auto-pill" class="hidden">
        <span class="pulse-dot"></span><span>AUTO</span>
      </div>
      <button id="theme-toggle-btn" title="Toggle theme" aria-label="Toggle light/dark mode">
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button id="btn-open-full" title="Open in full window" style="background:transparent;border:1px solid var(--b1);border-radius:7px;color:var(--mid);font-size:10px;font-weight:700;padding:3px 7px;cursor:pointer;transition:all .18s;font-family:'Satoshi','DM Sans',sans-serif;letter-spacing:.3px;">↗</button>
      <div class="dot" id="dot-silver"></div>
      <div class="dot" id="dot-blue"></div>
    </div>
  </div>

  <!-- Dashboard shortcut banner -->
  <button id="open-dashboard-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>Dashboard</span>
    <span class="dash-arrow">↗</span>
  </button>

  <!-- BRAIN PANEL -->
  <div id="brain-panel" class="brain-panel">
    <div class="brain-header" id="brain-toggle">
      <div class="brain-title">
        <span class="brain-icon">🧠</span>
        <span class="brain-label">SHARED BRAIN</span>
      </div>
      <div class="brain-summary">
        <span id="brain-size">—</span> questions
        <span class="brain-chevron">▾</span>
      </div>
    </div>
    <div class="brain-body" id="brain-body">
      <div class="brain-stat-row">
        <div class="brain-stat">
          <div class="brain-stat-num" id="brain-asked">0</div>
          <div class="brain-stat-label">questions you've asked</div>
        </div>
        <div class="brain-stat">
          <div class="brain-stat-num" id="brain-matched">0</div>
          <div class="brain-stat-label">matches you've received</div>
        </div>
        <div class="brain-stat">
          <div class="brain-stat-num" id="brain-helped">~0</div>
          <div class="brain-stat-label">est. students you've helped</div>
        </div>
      </div>
      <div id="brain-empty-msg" class="brain-empty" style="display:none">Ask your first question to start contributing to the brain</div>
      <div class="brain-recent" id="brain-recent">
        <div class="brain-recent-title">YOUR LAST QUESTION MATCHED</div>
        <div id="brain-recent-list"></div>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <canvas id="star-canvas"></canvas>
  <div id="chat-box"></div>

  <!-- BOTTOM SHEET — slides up over chat when active -->
  <div id="sheet-backdrop" class="hidden"></div>
  <div id="bottom-sheet" class="hidden">
    <div id="sheet-handle"></div>
    <div id="sheet-header">
      <span id="sheet-title"></span>
      <button id="sheet-close">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>

  <!-- INPUT AREA -->
  <div id="input-area">
    <!-- hidden stubs for page-nav IDs that popup.js may reference -->
    <button id="btn-dashboard"      style="display:none"></button>
    <button id="btn-hub"            style="display:none"></button>
    <button id="btn-game"           style="display:none"></button>
    <button id="btn-research"       style="display:none"></button>
    <button id="btn-more"           style="display:none"></button>
    <!-- Text input -->
    <div id="input-row">
      <input id="user-input" type="text" placeholder="Ask Pluto anything..." autocomplete="off"/>
      <button id="send-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>

</div><!-- /popup-main -->

<!-- Popup sidebar — feature tools + page nav -->
<nav class="popup-sidebar">

  <!-- ── Primary feature tools ── -->
  <button class="feat-btn popup-nav-item" id="btn-study">
    <span class="popup-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
    <span class="popup-nav-label">Study</span>
  </button>
  <button class="feat-btn popup-nav-item" id="btn-test">
    <span class="popup-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 12 2 2 4-4"/></svg></span>
    <span class="popup-nav-label">Test</span>
  </button>
  <button class="feat-btn popup-nav-item" id="btn-automate">
    <span class="popup-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
    <span class="popup-nav-label">Auto</span>
  </button>
  <button class="feat-btn popup-nav-item" id="btn-tutor">
    <span class="popup-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span>
    <span class="popup-nav-label">Tutor</span>
  </button>
  <button class="feat-btn popup-nav-item" id="btn-flash">
    <span class="popup-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></span>
    <span class="popup-nav-label">Cards</span>
  </button>
  <button class="feat-btn popup-nav-item" id="btn-essay">
    <span class="popup-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
    <span class="popup-nav-label">Essay</span>
  </button>
  <button class="feat-btn popup-nav-item" id="btn-timer">
    <span class="popup-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
    <span class="popup-nav-label">Timer</span>
  </button>

  <div class="popup-sidebar-divider"></div>

  <!-- ── Secondary feature tools ── -->
  <button class="feat-btn popup-nav-item" id="btn-pdf">
    <span class="popup-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
    <span class="popup-nav-label">PDF</span>
  </button>
  <button class="feat-btn popup-nav-item" id="btn-planner">
    <span class="popup-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
    <span class="popup-nav-label">Planner</span>
  </button>
  <button class="feat-btn popup-nav-item" id="btn-podcast">
    <span class="popup-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></span>
    <span class="popup-nav-label">Podcast</span>
  </button>
  <button class="feat-btn popup-nav-item" id="btn-vocab">
    <span class="popup-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3"/><path d="M4 19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7H6"/></svg></span>
    <span class="popup-nav-label">Vocab</span>
  </button>
  <button class="feat-btn popup-nav-item" id="btn-grade">
    <span class="popup-nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg></span>
    <span class="popup-nav-label">Grade</span>
